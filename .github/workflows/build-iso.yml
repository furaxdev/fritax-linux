name: Construire l'ISO Fritax Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Outils de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bison flex wget cpio unzip rsync bc python3 libncurses-dev file zip

      # Cache : SEULEMENT si la cle correspond exactement (meme config, memes sources).
      # AVANT on avait un « restore-keys » : il restaurait un dossier output/ perime
      # (outil uClibc deja compile) meme apres un changement de config -> le build
      # replantait toujours sur la meme erreur d'en-tetes. Plus jamais ca.
      # On SEPARE restauration et sauvegarde : la sauvegarde tourne meme si la
      # compilation echoue. Avant, un echec a la 70e minute jetait 70 minutes de
      # compilateur, et la tentative suivante repartait de zero. Plus jamais ca.
      - name: Restaurer le cache de compilation
        id: cache_buildroot
        uses: actions/cache/restore@v4
        with:
          path: |
            distro/buildroot-2026.02.3/output
            distro/buildroot-2026.02.3.tar.gz
          # Cle = UNIQUEMENT ce qui change le compilateur lui-meme (defconfig + board).
          # Les sources de nos applis (desktop/) n'y sont PLUS : Buildroot les
          # recompile de toute facon (build.sh efface leurs tampons a chaque run).
          key: fritax-buildroot-v2-${{ hashFiles('distro/configs/fritax_defconfig', 'distro/board/**') }}

      - name: Verifier la configuration retenue
        run: |
          cd distro
          # ATTENTION : le cache ne restaure que output/ , donc le dossier existe
          # meme quand l'arbre Buildroot n'a pas ete telecharge. Tester le MAKEFILE.
          if [ ! -f buildroot-2026.02.3/Makefile ]; then
            echo "arbre Buildroot absent -> telechargement"
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o br.tar.gz https://buildroot.org/downloads/buildroot-2026.02.3.tar.gz || { echo "ECHEC: telechargement de Buildroot impossible"; exit 1; }
            tar xzf br.tar.gz || { echo "ECHEC: extraction de Buildroot impossible"; exit 1; }
          fi
          [ -f buildroot-2026.02.3/Makefile ] || { echo "ECHEC: arbre Buildroot toujours absent"; exit 1; }
          cd buildroot-2026.02.3
          if ! make BR2_EXTERNAL=.. fritax_defconfig >/tmp/conf.log 2>&1; then
            echo "ECHEC: la configuration Fritax n'a pas pu s'appliquer"
            tail -20 /tmp/conf.log
            exit 1
          fi
          [ -f .config ] || { echo "ECHEC: aucun .config genere"; exit 1; }
          echo "--- bibliotheque C / en-tetes retenus ---"
          grep -E '^BR2_(TOOLCHAIN_BUILDROOT_(GLIBC|UCLIBC|MUSL)|KERNEL_HEADERS_AS_KERNEL|DEFAULT_KERNEL_HEADERS|LINUX_KERNEL)=' .config || echo "  (aucune)"
          grep -E '^BR2_TOOLCHAIN_HEADERS_AT_LEAST_' .config | head -5 || true
          echo "--- paquets fritax ---"
          grep -cE '^BR2_PACKAGE_FRITAX_[A-Z]+=y' .config

          # VERIFICATION BLOQUANTE : sans glibc, l'outil tombe sur uClibc qui exige
          # des en-tetes noyau 2.6.x -> echec 14 minutes plus tard. On refuse tout de suite.
          echo "--- controle bloquant ---"
          if ! grep -q '^BR2_TOOLCHAIN_BUILDROOT_GLIBC=y' .config; then
            echo "ECHEC: glibc non retenu dans .config"
            grep -E '^BR2_TOOLCHAIN_BUILDROOT_(GLIBC|UCLIBC|MUSL)=' .config || true
            exit 1
          fi
          if grep -q '^BR2_TOOLCHAIN_BUILDROOT_UCLIBC=y' .config; then
            echo "ECHEC: uClibc encore actif dans .config"
            exit 1
          fi
          if ! grep -q '^BR2_KERNEL_HEADERS_6_12=y' .config; then
            echo "ECHEC: serie d'en-tetes 6.12 non retenue"
            grep -E '^BR2_KERNEL_HEADERS' .config || true
            exit 1
          fi
          echo "OK: glibc + serie d'en-tetes 6.12 confirmes"

      - name: Compiler Fritax Linux (tout depuis les sources)
        env:
          JOBS: "4"
        run: |
          cd distro
          time ./build.sh
          ls -lh fritax-linux-1.0-nova.iso

      # Sauvegarde du travail deja fait, meme si la compilation a echoue :
      # la tentative suivante reprendra au lieu de repartir de zero.
      - name: Sauver le cache de compilation
        if: always() && steps.cache_buildroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            distro/buildroot-2026.02.3/output
            distro/buildroot-2026.02.3.tar.gz
          key: fritax-buildroot-v2-${{ hashFiles('distro/configs/fritax_defconfig', 'distro/board/**') }}

      - name: Publier l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: fritax-linux-1.0-nova
          path: distro/fritax-linux-1.0-nova.iso
          if-no-files-found: error
          retention-days: 30
