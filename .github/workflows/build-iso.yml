name: Construire l'ISO Fritax Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Outils de construction
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bison flex wget cpio unzip rsync bc                                   python3 libncurses-dev file

      - name: Compiler Fritax Linux (tout depuis les sources)
        env:
          JOBS: "4"
        run: |
          cd distro
          time ./build.sh
          ls -lh fritax-linux-1.0-nova.iso

      - name: Publier l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: fritax-linux-1.0-nova
          path: distro/fritax-linux-1.0-nova.iso
          if-no-files-found: error
          retention-days: 30
